# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Mandy Xue | Academic Homepage"
title_separator          : "-"
name                     : &name "Mandy Xue"
description              : &description "MSBA student at Santa Clara University | Research in Quantitative Modeling, Online Platforms, User Behavior, Customer Preference Prediction, Personalized Recommendation Systems"
url                      : "https://mengyu1013.github.io"
baseurl                  : "" 
repository               : "Mengyu1013/Mengyu1013.github.io"

# Site Author 
author:
  avatar           : "profile.png"  
  name             : "Mandy Xue"
  pronouns         : "she/her"
  bio              : "MSBA student @ Santa Clara University (Exp. Dec 2025). Research interests: Quantitative Modeling, Online Platforms, User Behavior, Customer Preference Prediction, Personalized Recommendation Systems."
  location         : "Santa Clara, CA, USA"
  employer         : "Santa Clara University"
  uri              : 
  email            : "mandyxue9@gmail.com"

  # Academic websites
  academia         : 
  arxiv            : 
  googlescholar    :    
  inspire-hep      : 
  impactstory      : 
  orcid            : 
  semantic         : 
  pubmed           : 
  researchgate     : 
  scopus           : 

  # Repositories and software development
  github           : "Mengyu1013"
  kaggle           : 
  stackoverflow    : 

  # Social media
  linkedin         : "mandy-xue1"
  twitter          : 
  zhihu            : 

# Site Settings
teaser                   :  
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               : false

atom_feed:
  hide                   : false

# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social Sharing
twitter:
  username               : 
facebook:
  username               : 
og_image                 :  
og_description           :  
social:
  type                   : Person
  name                   : "Mandy Xue"
  links:
    - "https://github.com/Mengyu1013"
    - "https://www.linkedin.com/in/mandy-xue1"
    - "mailto:mandyxue9@gmail.com"

# Analytics
analytics:
  provider               : false

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: America/Los_Angeles

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
